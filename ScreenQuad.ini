; Smart Factory - handheld screen quad fine-tune (1.0.11)
; ★1.0.10 起，屏幕贴片定位默认由【原版网格 section[2] 真实几何】自动计算（质心定位 / 法线朝向 /
;   面内主轴尺寸旋转），不再需要在这里猜测坐标。
; 本文件降级为「逃生口」：只有显式填写的 key 才会覆盖几何算出的对应分量；留空=纯几何。
;   修改后重新装备终端即生效（每次 Equip 重读），无需重编。
; 键（全部可选；填了即覆盖）：
;   OffsetX/Y/Z = 相对 HandMesh 的位置(cm)
;   Yaw/Pitch/Roll = 相对旋转(度)；Width/Height = 贴片尺寸(cm)
; 诊断：游戏日志搜 "[screen] 1.0.11 quad: src=geom ..." 看几何是否成功读取；
;   若出现 "position CPU data null" 会自动回退到 bounds 推导并照旧可用。
[ScreenQuad]
;OffsetX=0.0
;OffsetY=0.0
;OffsetZ=0.0
;Pitch=0
;Yaw=0
;Roll=0
;Width=11.5
;Height=6.5
