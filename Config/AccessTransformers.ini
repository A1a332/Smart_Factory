[AccessTransformers]
; UFGUnlockRecipe::mRecipes is the one member here that genuinely needs a friend: it is written
; through a UFGUnlockRecipe* that we do not derive from, so protected access is blocked for us and
; AccessTransformers has to open it by name.
;
; (UFGSchematic's own members -- mCost / mSchematicCategory / mTechTier / mUnlocks -- are protected
; too, but we only ever touch them through "this" from a UFGSchematic subclass, which standard C++
; already allows. The UFGSchematic lines below are belt-and-braces, carried over unchanged from the
; original two-milestone layout.)
;
; ★ The friend grant is PER CLASS, and friendship is NOT inherited in C++.
;   That is exactly why the write logic lives on UWTUpgradeMilestoneBase -- one class, one pair of
;   lines -- while the two concrete milestones (T3 storage / T5 production accelerator) only hand
;   over data. If you add a third upgrade later, give it a UWTUpgradeMilestoneBase subclass and it
;   inherits this wiring for free. Do NOT copy the write logic into the subclass: friendship does
;   not come with it, and it will fail C2248.
;
; The unlock itself must be a BP_UnlockRecipe_C instance (not our own native class), because the
; HUB's reward panel is drawn by blueprint graphs that only that class carries; a native
; UFGUnlockRecipe renders an empty Rewards panel. Same finding as WirelessPower v1.0.44.
Friend=(Class="UFGUnlockRecipe", FriendClass="URemote_FactoryMilestone")
Friend=(Class="UFGSchematic", FriendClass="URemote_FactoryMilestone")
Friend=(Class="UFGUnlockRecipe", FriendClass="UWTUpgradeMilestoneBase")
Friend=(Class="UFGSchematic", FriendClass="UWTUpgradeMilestoneBase")
; MAM research nodes (UWTUpgradeResearchBase) write UFGUnlockRecipe::mRecipes (unlock reward) and
; UFGSchematicPurchasedDependency's members (level->level dependency) on *separate* objects, which
; standard C++ protected access does not cover. UFGSchematic's own members are touched via `this`
; and need no friend (see note above).
Friend=(Class="UFGUnlockRecipe", FriendClass="UWTUpgradeResearchBase")
Friend=(Class="UFGSchematicPurchasedDependency", FriendClass="UWTUpgradeResearchBase")
